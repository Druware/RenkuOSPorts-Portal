# Security headers for every response.
#
# nginx does NOT inherit add_header into a block that declares any add_header of its own, so
# this file is included in the server block AND in every location that sets its own header.
# `always` makes them apply to error responses (404, 429, 5xx) too.
#
# CSP: the SPA loads its script, CSS and images same-origin (no inline scripts or style
# attributes in the production build); the only third party is Google Fonts (web/index.html).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# No includeSubDomains and no preload until every subdomain is confirmed HTTPS-only.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
