# Hardened nginx baseline.
# Runs as the unprivileged `nginx` user (uid 101): the Dockerfile sets USER, so there is no
# `user` directive here (it only applies when the master process starts as root). Everything
# nginx writes goes to /tmp, so the root filesystem can be mounted read-only.

worker_processes auto;
pid /tmp/nginx.pid;

# Logs go to the container's stdout/stderr (App Service / docker capture them); no log files.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    server_tokens off;

    sendfile on;
    tcp_nopush on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # ---- Request limits (slow-request / oversized-request DoS) ----
    # 1m for the SPA and the JSON API; the build client routes raise it (default.conf.template).
    client_max_body_size 1m;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    # Between two reads/writes, not for the whole transfer: generous enough for build clients
    # uploading and pkgman downloading multi-GiB packages over slow links.
    client_body_timeout 60s;
    send_timeout 60s;

    # ---- Real client IP ----
    # TLS terminates at the Azure App Service front end, which connects to the container from
    # the link-local range and reports the client in X-Forwarded-For. Only that range is trusted
    # to rewrite $remote_addr; X-Forwarded-For from anyone else is ignored.
    # ASSUMPTION to confirm at deploy: the front-end peer address is in 169.254.0.0/16.
    set_real_ip_from 169.254.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # X-Forwarded-Proto is likewise only believed when the connection came from the trusted
    # front end ($realip_remote_addr is the peer address before real_ip rewrote it).
    geo $realip_remote_addr $from_trusted_edge {
        default 0;
        169.254.0.0/16 1;
    }

    map "$from_trusted_edge:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }

    # ---- Rate limiting (defence in depth; the API has no limiter of its own) ----
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # ---- Logging ----
    # No query strings (OAuth state/code on the callback, return URLs): method, the raw path up
    # to "?", protocol, and the Referer without its query.
    map $request_uri $request_path {
        default "";
        "~^(?<request_path_part>[^?]*)" $request_path_part;
    }

    map $http_referer $referer_without_query {
        default "";
        "~^(?<referer_path>[^?]*)" $referer_path;
    }

    log_format main '$remote_addr (peer $realip_remote_addr) - [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent "$referer_without_query" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    # Static text assets only; API responses (and .hpkg downloads) are not compressed.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # Rendered from /etc/nginx/templates at container start (the root filesystem is read-only).
    # A named file, not a glob: if rendering did not happen, nginx fails to start instead of
    # silently running with no server block.
    include /tmp/conf.d/default.conf;
}
